# CI: chạy lint, kiểm tra kiểu và test trên môi trường sạch.
#
# Mục đích: biến các cổng kiểm tra thành rào chắn thật thay vì việc phải nhớ chạy
# tay. Trước đây repo đã có ruff + mypy + pytest nhưng không có gì bắt buộc chạy
# chúng, nên một commit có thể lên `main` mà chưa từng được kiểm.
#
# Chạy trên CẢ Ubuntu VÀ Windows vì hai lý do cụ thể, không phải cho đủ bộ:
#   - Máy phát triển là Windows, nên mã có những nhánh chỉ Windows mới đi qua
#     (`os.name == "nt"`, `os.chmod` không thực thi bit quyền kiểu POSIX).
#   - Nơi triển khai thật gần như chắc chắn là Linux.
# Chỉ chạy Ubuntu thì các nhánh Windows không bao giờ được kiểm, và ngược lại.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Quyền tối thiểu: CI chỉ cần đọc mã nguồn, không cần ghi gì.
permissions:
  contents: read

# Đẩy liên tiếp lên cùng một nhánh thì lần chạy cũ không còn ý nghĩa — huỷ đi để
# không chiếm runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ghi chú về hai cảnh báo SẼ THẤY trong log — cả hai đều vô hại, không phải lỗi:
#
# 1. "Python cache path ... does not exist on disk. Skipping Python cache save
#    because no managed Python installation was found."
#    Trên `ubuntu-24.04`, Python 3.12 đã có sẵn trong image nên uv dùng luôn bản hệ
#    thống và không có Python do uv quản lý để mà cache. Khi `ubuntu-latest` chuyển
#    sang Ubuntu 26 (19/10/2026), bản hệ thống sẽ không còn 3.12, uv sẽ tự tải Python
#    3.12 do nó quản lý, và cảnh báo này tự biến mất.
#    KHÔNG "sửa" bằng `UV_PYTHON_PREFERENCE=only-managed`: nó buộc uv tải Python mỗi
#    lần mà không đổi phiên bản Python thực dùng, vì `python-version: "3.12"` đã bảo
#    đảm đúng 3.12 bất kể image.
#
# 2. "Failed to save: Unable to reserve cache ... another job may be creating this
#    cache." — job `lint` và `test (ubuntu-latest)` cùng khoá cache nên tranh nhau
#    ghi. Đã xử lý bằng `save-cache: false` ở job `lint` bên dưới.

jobs:
  lint:
    name: Lint và kiểm tra kiểu
    runs-on: ubuntu-latest
    # Chặn trên để một bước bị treo không ngốn runner hàng giờ.
    timeout-minutes: 20
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      # `setup-uv` KHÔNG có tag nổi kiểu `v10` (chỉ có `v10.3.0`, `v10.2.0`...),
      # nên phải ghim đúng phiên bản. Đổi lại được tính tái lập: cùng một commit
      # luôn dùng đúng phiên bản uv, không phụ thuộc thời điểm chạy.
      #
      # `save-cache: false` vì job này cài đúng bộ phụ thuộc giống hệt job
      # `test (ubuntu-latest)`, nên chúng dùng chung một khoá cache. Để cả hai cùng
      # ghi thì GitHub báo "Unable to reserve cache" và một job mất lượt lưu — vô
      # hại nhưng làm log ồn ào. Cho `test` lo việc ghi, `lint` chỉ đọc lại.
      - name: Cài uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          save-cache: "false"

      # `--locked` khẳng định `uv.lock` đã khớp `pyproject.toml`. Nếu ai đó sửa
      # pyproject mà quên cập nhật lockfile thì job đỏ ngay, thay vì âm thầm
      # resolve ra một bộ phụ thuộc khác với bộ đang dùng ở máy phát triển.
      - name: Cài phụ thuộc
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Một hệ điều hành hỏng vẫn phải thấy kết quả của hệ còn lại. Nếu không,
      # lỗi chỉ xảy ra trên Windows sẽ bị che mất ngay khi Ubuntu đỏ trước.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-python: true

      - name: Cài phụ thuộc
        run: uv sync --locked

      # Bộ test mặc định không chạm mạng: `test_eval.py` gọi LLM thật đã bị loại
      # bằng marker `eval` trong `addopts` của pyproject.toml. Nhờ vậy CI không cần
      # API key, không phụ thuộc quota, và không đỏ vì trục trặc của nhà cung cấp.
      # Muốn chạy eval thì dùng `uv run pytest -q -m eval` ở máy có LLM_API_KEY.
      - name: Chạy test
        run: uv run pytest -q
